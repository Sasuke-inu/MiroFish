<!doctype html>
<html lang="zh-TW">
  <head>
    <script>
      try {
        document.documentElement.lang = localStorage.getItem('locale') || 'zh-TW'
        const preference = localStorage.getItem('mirofish.theme')
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiroFish 群體模擬工作室：整理關係、探索情境、閱讀報告。" />
    <title>MiroFish - 群體模擬工作室</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
