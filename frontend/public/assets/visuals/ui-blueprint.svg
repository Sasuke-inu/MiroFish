  <rect x="431" y="1025" width="69" height="106" rx="6" fill="#30352b"/>
  <text x="444" y="1051" class="small" fill="#f0eadc" style="fill:#f0eadc">外觀</text><path d="M445 1067h40m-40 15h31m-31 15h35" stroke="#838b72" stroke-width="3" stroke-linecap="round"/>
  <text x="517" y="1050" class="label" style="fill:#f0eadc">深色工作室</text>
  <rect x="517" y="1068" width="209" height="15" rx="4" fill="#30352b"/><rect x="517" y="1093" width="121" height="14" rx="4" fill="#30352b"/>
  <rect x="652" y="1090" width="74" height="25" rx="5" fill="#4e593f"/><text x="689" y="1108" text-anchor="middle" font-size="12" class="white">主要行動</text>

  <text x="798" y="1040" class="label">視覺層級</text>
  <circle cx="807" cy="1072" r="9" fill="#282b25"/><text x="828" y="1078" class="small">深藍：標題與主要行動</text>
  <circle cx="807" cy="1106" r="9" fill="#805014"/><text x="828" y="1112" class="small">琥珀色：選取狀態與視覺重點</text>
  <circle cx="807" cy="1140" r="9" fill="#515548"/><text x="828" y="1146" class="small">輔助文字：理解條件與結果</text>
  <rect x="1150" y="1010" width="226" height="139" rx="12" fill="#cbc6b9"/>
  <text x="1169" y="1040" class="label">設定包含</text>
  <text x="1169" y="1070" class="small muted">外觀 · 語言</text>
  <text x="1169" y="1098" class="small muted">服務連線 · 網頁收集</text>
  <text x="1169" y="1126" class="small muted">返回時接續原本工作</text>

  <path d="M64 1190h1312" class="line"/>
  <text x="64" y="1223" class="small muted">MIROFISH / 群體模擬工作室</text>
  <text x="1376" y="1223" class="small muted" text-anchor="end">區塊示意，非精確畫面截圖。所有文字與圖形皆可編輯。</text>
