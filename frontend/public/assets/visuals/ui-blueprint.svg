  <text x="167" y="1050" class="label">淺色工作室</text>
  <rect x="167" y="1068" width="209" height="15" rx="4" fill="#d9d5c9"/><rect x="167" y="1093" width="121" height="14" rx="4" fill="#d9d5c9"/>
  <rect x="302" y="1090" width="74" height="25" rx="5" fill="#282b25"/><text x="339" y="1108" text-anchor="middle" font-size="12" class="white">主要行動</text>
